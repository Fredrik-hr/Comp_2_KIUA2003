hovedtema: Kjernekraft – naturvirkninger
underemner:
  Arealbruk: areal som selve kraftverket og sikringssonen rundt det legger beslag på
  Naturmangfold: påvirkning på arter, leveområder og verdifulle naturtyper
  Vannmiljø og kjølevann: uttak av kjølevann og utslipp av oppvarmet vann til sjø, elv eller innsjø, og virkningene på livet i vannet
  Radioaktivt avfall: mellomlagring, deponi og langsiktig forvaltning av brukt brensel og annet avfall, også lekkasje fra lager og deponi
  Strålevern, utslipp og ulykker: stråling og utslipp ved normal drift, og ulykkesrisiko med følger for natur og mennesker
  Landskap og friluftsliv: visuell påvirkning, støy og tap av turområder
  Følgeinngrep: kraftledninger, veier, havner og annen infrastruktur som bygges i tillegg til selve kraftverket
  Sammenligning med andre energikilder: når en naturvirkning av kjernekraft settes opp mot vindkraft, vannkraft eller andre kilder
