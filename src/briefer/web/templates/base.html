<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Agenda Brief Builder{% endblock %}</title>
<style>
:root{--bg:#F4F5F2;--panel:#FFFFFF;--soft:#FAFBF9;--fg:#17201C;--fg2:#3B4540;--muted:#4F5A54;
--rule:#D9DED9;--rule2:#E6E9E5;--field:#A9B6AE;--quote:#F4F5F2;--brand:#1F5C45;--brand-dk:#174A37;
--brand-tint:#E6EFEA;--on-brand:#FFFFFF;--on-brand2:#D5E6DD;--banner:#F2C94C;--on-banner:#3B2E05;
--info:#24577F;--info-bg:#E8F0F7;--info-rule:#BCD0E2;--ok:#1F5C45;--ok-bg:#EAF4EE;--ok-rule:#A8CBB7;
--bad:#A33A3A;--bad-bg:#FBECEC;--bad-rule:#E3B9B9;--warn:#8A5410;--warn-bg:#FBF1E3;--warn-rule:#E5C79B;
--chip:#EEF0EC;--code-bg:#17201C;--code-fg:#E7ECE8;--mark:#F2E3A8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1C211E;
--soft:#202622;--fg:#E8ECE9;--fg2:#C9D0CB;--muted:#A3ADA7;--rule:#323A35;--rule2:#2A312D;--field:#56625B;
--quote:#242A26;--brand:#1F5C45;--brand-dk:#174A37;--brand-tint:#21372D;--info:#9CC3E6;--info-bg:#1D2A36;
--info-rule:#34506A;--ok:#8FD0AB;--ok-bg:#1C2E24;--ok-rule:#2F5A43;--bad:#EF9A9A;--bad-bg:#371F1F;
--bad-rule:#6A3434;--warn:#E9B872;--warn-bg:#33281A;--warn-rule:#66502C;--chip:#29302C;
--code-bg:#0E1210;--mark:#5A4E20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.5 "Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--brand)}a:hover{color:var(--brand-dk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--ok)}}
code,pre{font-family:ui-monospace,Consolas,monospace}
.sr{position:absolute;left:-9999px}
/* header */
.top{background:var(--brand);color:var(--on-brand)}
.top-in{max-width:1280px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:16px;
align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;color:var(--on-brand)!important;text-decoration:none}
.brand b{display:block;font-size:18px;line-height:1.2}.brand small{display:block;font-size:13px;color:var(--on-brand2)}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav>a{color:var(--on-brand)!important;text-decoration:none;padding:10px 14px;border-radius:4px}
.nav>a[aria-current="page"]{background:var(--brand-dk);font-weight:600}
.sep{width:1px;height:28px;background:#4E8169;margin:0 6px}
.langs{display:flex;border:1px solid #7FA894;border-radius:4px;overflow:hidden}
.langs a{color:var(--on-brand)!important;text-decoration:none;padding:8px 12px;min-width:44px;
text-align:center;font-weight:600}
.langs a[aria-current="true"]{background:#FFFFFF;color:#1F5C45!important;font-weight:700}
.banner{background:var(--banner);color:var(--on-banner);font-size:13px;text-align:center;padding:4px 16px}
main{max-width:1280px;margin:0 auto;padding:24px 16px 64px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
h1{margin:0;font-size:32px;line-height:1.15}
.lead{margin:6px 0 24px;color:var(--muted)}
/* building blocks */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:20px 24px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:13px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:0}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--fg2)}
.status{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px;border:1px solid var(--rule);white-space:nowrap}
.s-awaiting_review{background:var(--info-bg);color:var(--info);border-color:var(--info-rule)}
.s-approved{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-rule)}
.s-rejected,.s-halted{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-rule)}
.s-draft_incomplete{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-rule)}
.s-skipped{background:var(--chip);color:var(--fg2)}
.q{display:inline-flex;border:1px solid var(--rule);border-radius:4px;font-size:13px;overflow:hidden}
.q b{background:var(--brand-tint);color:var(--brand);padding:2px 6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q b{color:var(--ok)}}
.q span{padding:2px 8px}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{display:inline-block;font:inherit;font-weight:600;padding:10px 16px;border-radius:4px;cursor:pointer;
text-decoration:none;border:1px solid var(--field);background:var(--panel);color:var(--fg)!important;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#FFFFFF!important}
.btn.outline{border-color:var(--brand);color:var(--brand)!important}
.btn.danger{border-color:var(--bad);color:var(--bad)!important}
.btn.sm{padding:8px 12px;min-width:44px;font-weight:600}
form.inline{display:inline}
input[type=file],select,textarea,input[type=password]{font:inherit;color:var(--fg);background:var(--panel);
border:1px solid var(--field);border-radius:4px;padding:9px 10px}
textarea{width:100%;min-height:5rem;display:block;margin-top:4px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:16px}
.stat b{display:block;font-size:30px;line-height:1.2}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
pre.raw{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:16px 20px;
font-size:13px;line-height:1.55;overflow-x:auto;white-space:pre}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--rule2);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;border-bottom-color:var(--rule)}
.scroll{overflow-x:auto}
{% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M8 10h16M8 16h16M8 22h10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>
      <span><b>Agenda Brief Builder</b><small>{{ t.org }}</small></span>
    </a>
    <nav class="nav" aria-label="{{ t.main_nav }}">
      <a href="/" {% if section == "meetings" %}aria-current="page"{% endif %}>{{ t.meetings }}</a>
      <a href="/how" {% if section == "how" %}aria-current="page"{% endif %}>{{ t.how }}</a>
      <span class="sep" aria-hidden="true"></span>
      <div class="langs" role="group" aria-label="{{ t.lang_label }}">
        {% for l in langs %}<a href="/lang/{{ l }}" hreflang="{{ l }}" aria-current="{{ 'true' if l == lang else 'false' }}">{{ l | upper }}</a>{% endfor %}
      </div>
    </nav>
  </div>
  <div class="banner">{{ t.test_banner }}</div>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
