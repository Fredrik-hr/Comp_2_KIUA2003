<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Agenda Brief Builder{% endblock %}</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--fg:#1e1e1c;--muted:#6a6862;--rule:#dcd9cf;--quote:#f1efe7;
--accent:#2d5b8a;--ok:#2e7d4f;--warn:#a5651b;--bad:#a33a3a}
@media (prefers-color-scheme: dark){:root{--bg:#191918;--panel:#222220;--fg:#ebeae4;
--muted:#a19f97;--rule:#3a3935;--quote:#2a2a27;--accent:#8db4dc;--ok:#7cc79a;--warn:#e0a85c;
--bad:#e08080}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{display:flex;gap:1rem;align-items:center;justify-content:space-between;
padding:.75rem 16px;border-bottom:1px solid var(--rule);background:var(--panel)}
header a{color:var(--fg);text-decoration:none;font-weight:600}
nav.lang a{margin-left:.5rem;color:var(--accent);font-weight:400}
main{max-width:76rem;margin:0 auto;padding:1rem 16px 3rem}
table{border-collapse:collapse;width:100%;background:var(--panel)}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.85rem}
a{color:var(--accent)}
.status{font-size:.8rem;padding:.1rem .45rem;border-radius:.25rem;border:1px solid var(--rule)}
.s-approved{color:var(--ok);border-color:var(--ok)} .s-awaiting_review{color:var(--accent);border-color:var(--accent)}
.s-rejected,.s-halted{color:var(--bad);border-color:var(--bad)} .s-draft_incomplete{color:var(--warn);border-color:var(--warn)}
.muted{color:var(--muted)} .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;
background:var(--panel);border:1px solid var(--rule);padding:1rem;margin:1rem 0}
@media (max-width:760px){.row{grid-template-columns:1fr}}
blockquote{margin:0;background:var(--quote);padding:.75rem;white-space:pre-wrap;font-family:Georgia,serif}
.removed{opacity:.45}
img.page{width:100%;border:1px solid var(--rule);background:#fff}
form.inline{display:inline}
button{font:inherit;padding:.3rem .7rem;border:1px solid var(--rule);background:var(--panel);
color:var(--fg);border-radius:.25rem;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--bad)}
textarea{width:100%;min-height:4rem;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--rule)}
.note{font-style:italic;color:var(--muted)} .disclaimer{border-left:3px solid var(--accent);padding:.4rem .75rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.75rem 0}
</style>
</head>
<body>
<header><a href="/">Agenda Brief Builder</a>
<nav class="lang"><a href="/lang/nb">nb</a><a href="/lang/nn">nn</a><a href="/lang/en">en</a></nav></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
