name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"   # nightly regression evaluation (T42)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check src eval tests
      - run: pytest -q

  eval-replay:
    # Deterministic evaluation from the record/replay cache. Needs the cached LLM answers and
    # the source PDFs, which are not committed (copyright, size); restore them from the
    # `eval-fixtures` cache or skip.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - uses: actions/cache/restore@v4
        id: fixtures
        with:
          path: |
            data/llm_cache
            algorithms.pdf
          key: eval-fixtures
      - if: steps.fixtures.outputs.cache-hit == 'true'
        run: python tests/cases/make_synthetic.py && python eval/harness.py
      - if: steps.fixtures.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with: {name: eval-report, path: eval/runs}
