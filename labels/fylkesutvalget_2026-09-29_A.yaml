      section: Saksfremlegg, innstilling pkt. 7
      via: search
      quote: Fylkesutvalget bemerker at undersøkelsesplikten etter kulturminnelovens § 9 ikke er oppfylt
        i forbindelse med forelagte planforslag. Dette skal senest gjøres på reguleringsplannivå. Fylkesutvalget
