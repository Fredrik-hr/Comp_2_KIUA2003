        for friluftsliv. Delområdet er et kartlagt viktig friluftsområde, og utbygging her vil gi sterk
        negativ konsekvens for friluftslivet.
    - document: local:fylkesutvalget_2026-09-29.pdf
      physical_page: 796
      section: Saksfremlegg, innstilling pkt. 3
      via: search
      quote: Delområde N_F9 innebærer inngrep i statlig sikra friområde. Fylkesutvalget forutsetter at
        bestemmelsene justeres slik at brukere av friområde kan benytte arealet til parkering.
    - document: local:fylkesutvalget_2026-09-29.pdf
      physical_page: 796
      section: Saksfremlegg, innstilling pkt. 4
      via: search
      quote: Fylkesutvalget ber kommunen vurdere vannmiljø som tema i konsekvensutredningen og bestemmelser
        til bruk og vern av sjø og vassdrag uavhengig av LNFR formålet. Videre mener vi kommunen ikke
        må legge til rette for boligutvikling i flomutsatte områder.
    - document: local:fylkesutvalget_2026-09-29.pdf
      physical_page: 796
      section: Saksfremlegg, innstilling pkt. 5
      via: search
      quote: Fylkesutvalget ber kommunen ivareta hensyn til barn og unge ved å ta inn krav til lekeplass
        innunder pkt. 3.5.2 uteoppholdsarealer.
    - document: local:fylkesutvalget_2026-09-29.pdf
      physical_page: 796
      section: Saksfremlegg, innstilling pkt. 6
      via: search
      quote: Fylkesutvalget ber om hensynssone for bevaring av kulturmiljø øst for brua på Fagernes utvides
        inn i Jernbanevegen, og i tillegg inkluderer kulturmiljøet på vestsida av elva.
    - document: local:fylkesutvalget_2026-09-29.pdf
